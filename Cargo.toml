[package]
name = "rdpbeacon"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
humantime-serde = "1.1"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
ctrlc = "3.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xtest", "screensaver"] }
