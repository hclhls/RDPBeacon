# RDPBeacon Example Configuration
# Copy this file to config.toml and customize it as needed.
# All durations support human-friendly formats (e.g., "4m", "240s", "3m 30s", "500ms").

# Interval between beacon cycles.
# In tray daemon mode this can be changed from the tray menu while running;
# menu changes apply from the next wait and are not written back to this file.
# Default: "10m" (600 seconds)
interval = "10m"

# Random jitter applied to the interval (+/- jitter).
# The actual sleep duration is chosen uniformly in [interval - jitter, interval + jitter],
# clamped to a minimum duration of 1s.
# Default: "20s"
jitter = "20s"

# Minimum user idle duration required before sending a beacon when the Horizon
# window is actively focused. If you are actively working inside Horizon, cycles
# are skipped because your local input already keeps the remote session active.
# Background sessions (when working in other local windows) are kept active regardless.
# Note: On Wayland, cross-compositor idle detection is not available, so
# the beacon fires at the configured interval unconditionally.
# Default: "3m" (180 seconds)
idle_threshold = "3m"

# Show a desktop notification this long before each beacon is sent, so you are
# not surprised by simulated input. Set to "0s" to disable. If the wait until the
# next beacon is shorter than this value, the notification is shown immediately.
# Linux uses the org.freedesktop.Notifications D-Bus service; Windows uses a
# tray balloon notification.
# In tray daemon mode this can also be changed from the tray menu (not persisted).
# Default: "10s"
notify_before = "10s"

# Duration of the screen fade-out and fade-in screen effect around beacon firing
# to reduce visual annoyance. Set to "0ms" to disable.
# When enabled, all monitors are faded to black before the beacon is sent (including
# window focus switching) and faded back in immediately after.
# Note: On Wayland the fade needs a compositor with wlr-layer-shell (Sway, Hyprland,
# KDE Plasma, COSMIC). On GNOME, and on X11 without a running compositing manager,
# the fade is skipped with a warning.
# In tray daemon mode the fade can be switched on or off from the tray menu (not
# persisted); switching it on while this is "0ms" uses a 300ms fade.
# Default: "0ms" (disabled)
fade_duration = "0ms"

# Keystroke to simulate when `mode = "key"`.
# Supported values include Shift_L, Ctrl, Alt, standard function keys (F1-F24),
# Space, Enter, Esc, Tab, Backspace, arrow keys. Shift_L is strongly recommended
# as it produces no character and translates cleanly across standard 101/104-key
# PC keyboard layouts used by Omnissa / VMware Horizon Client.
# Note: Raw hex codes are platform-specific (VK code on Windows, keysym on X11,
# evdev code on Wayland). Using named keys (e.g., "Shift_L") is recommended.
# Default: "Shift_L"
key = "Shift_L"

# Beacon injection mode: "key" or "mouse".
# - "key": Simulates a single key press and release of `key` into the Horizon session.
# - "mouse": Nudges the mouse cursor by +1 pixel relative and restores it (-1 pixel).
#   (Note: relative mouse events affect the window under the cursor, whereas key mode
#   targets the focused Horizon window).
# Keep the pointer inside the Horizon desktop surface when using mouse mode.
# Default: "mouse"
mode = "mouse"

# Case-insensitive substring used to locate the Omnissa Horizon Client window.
# In X11 this matches window title or WM_CLASS; in Windows this matches window title.
# Re-evaluated on every cycle so window restarts or title changes are handled gracefully.
# Default: "Omnissa Horizon Client"
window_match = "Omnissa Horizon Client"

# Number of consecutive cycles the Horizon Client window may be missing before
# the daemon shuts down with an error. Set to 0 to disable or increase if Horizon
# takes longer to start or reconnect.
# Default: 5
max_misses = 5

# Display backend override.
# When omitted or commented out, RDPBeacon automatically detects the backend
# from the environment (e.g., XDG_SESSION_TYPE, WAYLAND_DISPLAY, or OS).
# Options: "x11", "wayland", "windows"
# Default: auto-detect (None)
# backend = "x11"
